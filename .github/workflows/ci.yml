
name: GiveMeTeam CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Получаем исходный код репозитория
      - name: Checkout repository
        uses: actions/checkout@v6

      # Устанавливаем .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Восстанавливаем зависимости
      - name: Restore
        run: dotnet restore backend/GiveMeTeam.slnx

      - name: Build
        run: dotnet build backend/GiveMeTeam.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/GiveMeTeam.slnx --configuration Release --no-build --no-restore
